# Compila VoxFlow solo para Windows (instalador NSIS). Linux se compila en local con ./build.sh.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # bindgen (whisper-rs-sys) necesita libclang; viene con LLVM en el runner.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias del frontend
        run: pnpm install --frozen-lockfile

      - name: Lint y tests del frontend
        run: |
          pnpm lint
          pnpm test

      - name: Tests de Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Instalador de Windows (NSIS)
        run: pnpm tauri build --bundles nsis

      - name: Checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          Get-ChildItem $dir -Filter *-setup.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Append -Encoding ascii "$dir/SHA256SUMS-windows"
          }
          Get-Content "$dir/SHA256SUMS-windows"

      - uses: actions/upload-artifact@v4
        with:
          name: voxflow-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS-windows
          if-no-files-found: error

  release:
    # Solo al empujar un tag v*: adjunta el instalador al release de ese tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voxflow-windows
          path: dist-win
      - name: Adjuntar al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --title "VoxFlow $GITHUB_REF_NAME" --notes "Instalador de Windows (sin firmar)."
          gh release upload "$GITHUB_REF_NAME" dist-win/*-setup.exe dist-win/SHA256SUMS-windows --repo "$GITHUB_REPOSITORY" --clobber
