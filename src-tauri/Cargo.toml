[package]
name = "voxflow"
version = "0.3.1"
edition = "2021"
description = "Dictado local en español para Linux"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "voxflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = { version = "0.16", features = ["log_backend"] }
ureq = "3"
sha2 = "0.10"
tauri-plugin-single-instance = "2"

[dev-dependencies]
hound = "3.5"

[profile.release]
strip = true
lto = "thin"

[target."cfg(windows)".dependencies]
arboard = { version = "3", default-features = false }
cpal = "0.18"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Diagnostics_Debug"] }
