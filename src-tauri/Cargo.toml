[package]
name = "voxflow"
version = "0.1.0"
edition = "2021"
description = "Dictado local en español para Linux"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "voxflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
